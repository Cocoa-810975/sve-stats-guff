<html lang="zh-CN">

<style>
  body{margin:0;background:#0f0f1a;color:#e8eef8;font-family:"Microsoft YaHei",system-ui,sans-serif;line-height:1.6}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:24px;margin:6px 0 4px}
  .sub{color:#96a5b9;font-size:13px;margin-bottom:18px}
  .card{background:#161a26;border:1px solid #252b3b;border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 8px}
  .row{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0;border-bottom:1px dashed #222838}
  .ok{color:#4ade80}.bad{color:#f87171}.wait{color:#96a5b9}
  .path{font-family:Consolas,monospace;font-size:12px;color:#8fa3b8;word-break:break-all}
  .thumb{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#0b0d14;border:1px solid #333}
  .summary{font-size:15px;font-weight:700;padding:12px 16px;border-radius:10px;margin-bottom:18px}
  .s-ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.4);color:#4ade80}
  .s-bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#f87171}
  code{background:#0b0d14;padding:1px 5px;border-radius:4px;font-size:12px}
  .note{color:#96a5b9;font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>卡图加载自检</h1>
  <div class="sub">在本页直接测试每张缩略图能否加载。全部通过说明资源没问题，问题在页面缓存。</div>
  <div id="summary" class="summary wait">正在检测…</div>
  <div id="root" class="card">
    <h2>环境信息</h2>
    <div class="row"><span>当前页面</span><span class="path" id="env-url"></span></div>
    <div class="row"><span>路径基准</span><span class="path" id="env-base"></span></div>
  </div>
  <div id="list"></div>
  <div class="note">
    提示：如果这里全部是绿色 OK，但报告页仍是破图，说明是<strong>浏览器缓存了旧版 charts.js / HTML</strong>，
    请按 <code>Ctrl + Shift + R</code> 强制刷新那个页面。
  </div>
</div>

var BASE = new URL('assets/cards/thumbs/', location.href).href;
document.getElementById('env-url').textContent = location.href;
document.getElementById('env-base').textContent = BASE;

var root = document.getElementById('list');
var stat = { ok: 0, bad: 0, total: 0 };
var badList = [];

Object.keys(PER_VERSION).forEach(function(v) {
  var names = PER_VERSION[v];
  var card = document.createElement('div');
  card.className = 'card';
  var h = document.createElement('h2');
  h.textContent = v + '（' + names.length + ' 张）';
  card.appendChild(h);
  var box = document.createElement('div');
  card.appendChild(box);
  root.appendChild(card);

  names.forEach(function(name) {
    stat.total++;
    var row = document.createElement('div');
    row.className = 'row';
    var img = document.createElement('img');
    img.className = 'thumb';
    img.alt = '';
    var span = document.createElement('span');
    span.className = 'path';
    span.textContent = name;
    var st = document.createElement('span');
    st.className = 'wait';
    st.textContent = '检测中…';
    row.appendChild(img);
    row.appendChild(span);
    row.appendChild(st);
    box.appendChild(row);

    var url = BASE + name;
    img.onload = function() {
      // 缩略图都是 160x160；尺寸不对说明拿到的是别的东西
      var w = img.naturalWidth, h2 = img.naturalHeight;
      if (w === 160 && h2 === 160) {
        st.className = 'ok';
        st.textContent = 'OK ' + w + 'x' + h2;
        stat.ok++;
      } else {
        st.className = 'bad';
        st.textContent = '尺寸异常 ' + w + 'x' + h2;
        stat.bad++;
        badList.push(name + ' 尺寸 ' + w + 'x' + h2);
      }
      updateSummary();
    };
    img.onerror = function() {
      st.className = 'bad';
      st.textContent = '加载失败';
      stat.bad++;
      badList.push(name + ' 加载失败');
      updateSummary();
    };
    img.src = url;
  });
});

function updateSummary() {
  var el = document.getElementById('summary');
  if (stat.ok + stat.bad < stat.total) {
    el.className = 'summary wait';
    el.textContent = '检测中… ' + (stat.ok + stat.bad) + '/' + stat.total;
    return;
  }
  if (stat.bad === 0) {
    el.className = 'summary s-ok';
    el.textContent = '✓ 全部通过：' + stat.total + ' 张缩略图都能正常加载（160x160）';
  } else {
    el.className = 'summary s-bad';
    el.textContent = '✗ ' + stat.bad + ' / ' + stat.total + ' 张失败 —— ' + badList.slice(0, 5).join('；');
  }
}

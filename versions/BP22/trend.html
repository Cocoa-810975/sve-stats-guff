<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BP22 每周上位数趋势｜SVE Stats Guff</title>
<style>
:root{
  --bg:#0f0f1a; --panel:#1a1a2e; --panel-2:#111827; --line:#2a2a3e;
  --line-soft:rgba(255,255,255,0.05); --text:#e0e0e0; --text-strong:#fff;
  --muted:#8899aa; --accent:#e94560;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  padding:20px 20px 60px;max-width:1400px;margin:0 auto}
.header{background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);
  padding:32px 28px 26px;border-radius:16px;margin-bottom:22px;text-align:center;
  border:1px solid rgba(255,255,255,0.1)}
.header h1{color:#fff;font-size:26px;font-weight:800;letter-spacing:.5px}
.header .sub{color:#9aa8bd;font-size:13px;margin-top:8px}
.stats{display:flex;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.stat{flex:1 1 200px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:18px;text-align:center}
.stat .num{font-size:30px;font-weight:800;color:var(--accent)}
.stat .label{color:var(--muted);font-size:12px;margin-top:6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{color:#fff;font-size:17px;font-weight:700;margin-bottom:6px;padding-left:10px;
  border-left:4px solid var(--accent);line-height:1.2}
.hint{color:var(--muted);font-size:12px;line-height:1.7;margin:10px 0 16px}
#trend{width:100%;height:560px}
.note{color:#667788;font-size:12px;line-height:1.7;margin-top:16px}
</style>
</head>
<body>
<div class="header">
  <h1>BP22 每周上位数趋势</h1>
  <div class="sub">数据来源 bushi-navi.com ｜ 上位数前 10 的卡组类型每周变化</div>
</div>

<div class="stats">
  <div class="stat"><div class="num">995</div><div class="label">收录上位卡组（套）</div></div>
  <div class="stat"><div class="num">5</div><div class="label">覆盖周数（周五起算）</div></div>
  <div class="stat"><div class="num">10</div><div class="label">展示的卡组类型</div></div>
</div>

<div class="panel">
  <h2>每周上位数</h2>
  <div class="hint">
    横轴为「周」，每周 = <b>周五 ~ 下周四</b>（与网站其它周统计口径一致）。纵轴为该周收录到的上位套数。<br>
    只展示本弹上位数总量前 10 的卡组类型；点上图例可单独查看某几条曲线。
  </div>
  <div id="trend"></div>
  <div class="note">
    说明：上位 = 数据源记录的入赏卡组（已按赛事人数过滤：不足 8 人的赛事整场排除，8~16 人的赛事只取前 4 名）。
    某个类型在某周为 0 表示该周没有它的入赏记录。
  </div>
</div>

<script src="./_shared/js/echarts.min.js"></script>
<script>
(function(){
  var D = {"x":["10/02","10/09","10/16","10/23","10/30"],"xFull":["2026/10/02-2026/10/08","2026/10/09-2026/10/15","2026/10/16-2026/10/22","2026/10/23-2026/10/29","2026/10/30-2026/11/05"],"series":[{"name":"雷维翁皇｜皇家护卫","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#e94560"},"emphasis":{"focus":"series"},"data":[20,55,44,44,45]},{"name":"五妹龙｜龙族","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#8bd3ff"},"emphasis":{"focus":"series"},"data":[34,47,41,20,37]},{"name":"守护教｜主教","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#2ecc71"},"emphasis":{"focus":"series"},"data":[32,21,12,6,7]},{"name":"哥布林梦｜梦魇","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#f1c40f"},"emphasis":{"focus":"series"},"data":[4,32,11,8,9]},{"name":"学院法｜巫师","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#9b59b6"},"emphasis":{"focus":"series"},"data":[7,11,4,6,17]},{"name":"横马｜赛马娘","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#e67e22"},"emphasis":{"focus":"series"},"data":[12,20,7,2,1]},{"name":"二妹法｜巫师","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#1abc9c"},"emphasis":{"focus":"series"},"data":[6,17,9,4,4]},{"name":"金币皇｜皇家护卫","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#e84393"},"emphasis":{"focus":"series"},"data":[7,12,8,3,5]},{"name":"八狱法｜巫师","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#00cec9"},"emphasis":{"focus":"series"},"data":[1,4,6,8,14]},{"name":"妖精妖｜精灵","type":"line","smooth":true,"symbol":"circle","symbolSize":6,"lineStyle":{"width":2.4},"itemStyle":{"color":"#bdc3c7"},"emphasis":{"focus":"series"},"data":[7,10,4,7,2]}],"totals":[208,179,78,64,45,42,40,35,33,30]};
  var el = document.getElementById('trend');
  if (!el || !window.echarts) return;
  var chart = echarts.init(el, null, { renderer: 'canvas' });
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      backgroundColor: 'rgba(16,18,30,0.95)',
      borderColor: 'rgba(255,255,255,0.15)',
      textStyle: { color: '#e0e0e0', fontSize: 12 },
      formatter: function(ps){
        var idx = ps[0].dataIndex;
        var lines = ['<b>' + D.xFull[idx] + '</b>'];
        ps.filter(function(p){ return p.value > 0; })
          .sort(function(a,b){ return b.value - a.value; })
          .forEach(function(p){
            lines.push(p.marker + p.seriesName + '：<b>' + p.value + '</b> 套');
          });
        if (lines.length === 1) lines.push('该周无记录');
        return lines.join('<br/>');
      }
    },
    legend: {
      top: 0, type: 'scroll', textStyle: { color: '#9aa8bd', fontSize: 12 },
      itemWidth: 18, itemHeight: 10, pageTextStyle: { color: '#9aa8bd' }
    },
    grid: { left: 48, right: 24, top: 74, bottom: 42 },
    xAxis: {
      type: 'category', boundaryGap: false, data: D.x,
      axisLine: { lineStyle: { color: 'rgba(255,255,255,0.18)' } },
      axisLabel: { color: '#8899aa', fontSize: 11, interval: 'auto', rotate: D.x.length > 14 ? 40 : 0 },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'value', name: '上位数',
      nameTextStyle: { color: '#8899aa', fontSize: 11 },
      axisLabel: { color: '#8899aa', fontSize: 11 },
      splitLine: { lineStyle: { color: 'rgba(255,255,255,0.06)' } }
    },
    series: D.series
  });
  window.addEventListener('resize', function(){ chart.resize(); });
})();
</script>
</body>
</html>

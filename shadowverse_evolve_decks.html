  <script>
    (function() {
      var versions = {
        BP22: {
          src: 'versions/BP22/shadowverse_evolve_decks.html',
          text: '当前版本：BP22｜时间范围：2026年10月2日起（含10月2日）',

          exists: true
        },
        BP20: {
          src: 'versions/BP20/shadowverse_evolve_decks.html',
          text: '当前版本：BP20｜时间范围：2026年5月22日-2026年7月30日（含首尾日期）',
          start: '2026-05-22T00:00:00+00:00',
          end: '2026-07-31T00:00:00+00:00',
          exists: true
        },
        BP19: {
          src: 'versions/BP19/shadowverse_evolve_decks.html',
          text: '当前版本：BP19｜时间范围：2026年3月27日-2026年5月21日（含首尾日期）',
          start: '2026-03-27T00:00:00+00:00',
          end: '2026-05-22T00:00:00+00:00',
          exists: true
        },
        BP18: {
          src: 'versions/BP18/shadowverse_evolve_decks.html',
          text: '当前版本：BP18｜时间范围：2025年11月21日-2026年1月29日（含首尾日期）',
          start: '2025-11-21T00:00:00+00:00',
          end: '2026-01-30T00:00:00+00:00',
          exists: true
        }
      };
      var frame = document.getElementById('report-frame');
      var loading = document.getElementById('loading');
      var subtitle = document.getElementById('version-subtitle');
      var openCurrent = document.getElementById('open-current');
      var lastUpdated = document.getElementById('last-updated');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.version-btn'));
      var loadingTimer = null;

      function hideLoading() {
        if (!loading) return;
        loading.style.opacity = '0';
        setTimeout(function() { loading.style.display = 'none'; }, 220);
      }

      function showLoading() {
        if (!loading) return;
        if (loadingTimer) clearTimeout(loadingTimer);
        loading.style.opacity = '1';
        loading.style.display = 'block';
        loadingTimer = setTimeout(hideLoading, 1800);
      }

      function getInitialVersion() {
        var params = new URLSearchParams(window.location.search || '');
        var fromQuery = String(params.get('version') || '').toUpperCase();
        if (versions[fromQuery]) return fromQuery;
        // 未显式指定版本时，以「当前日期所属版本」为准（新版本发布后自动切换）；
        // 该版本暂无数据时再退回用户上次选择。
        var byDate = versionForDate(Date.now());
        if (byDate && hasData(byDate)) return byDate;
        try {
          var saved = String(localStorage.getItem('sve_selected_version') || '').toUpperCase();
          if (versions[saved]) return saved;
        } catch (error) {}
        return pickVersionByDate();
      }

      // 按当前日期选出该日所属的版本（区间按日本时间定义，边界含起始日、不含结束日）
      function versionForDate(now) {
        var keys = Object.keys(versions);
        for (var i = 0; i < keys.length; i++) {
          var info = versions[keys[i]];
          if (!info.start) continue;
          var start = new Date(info.start).getTime();
          if (isNaN(start)) continue;
          var end = info.end ? new Date(info.end).getTime() : Infinity;
          if (now >= start && now < end) return keys[i];
        }
        return null;
      }

      // 当前日期没有对应版本时，回退到最近一个「起始时间已到」的版本
      function latestStartedVersion(now) {
        var keys = Object.keys(versions);
        for (var i = 0; i < keys.length; i++) {
          var info = versions[keys[i]];
          if (!info.start) continue;
          var start = new Date(info.start).getTime();
          if (!isNaN(start) && now >= start) return keys[i];
        }
        return keys[0];
      }

      function hasData(key) {
        return !!(versions[key] && versions[key].exists);
      }

      function pickVersionByDate(nowMs) {
        var now = typeof nowMs === 'number' ? nowMs : Date.now();
        var byDate = versionForDate(now);
        if (byDate && hasData(byDate)) return byDate;
        var fallback = latestStartedVersion(now);
        if (hasData(fallback)) return fallback;
        var keys = Object.keys(versions);
        for (var i = 0; i < keys.length; i++) if (hasData(keys[i])) return keys[i];
        return byDate || fallback || 'BP22';
      }

      function formatUpdatedAt(value) {
        if (!value) return '';
        var d = new Date(value);
        if (isNaN(d.getTime())) return '';
        return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      function loadLastUpdated() {
        if (!lastUpdated || !window.fetch) return;
        fetch('last_updated.json?ts=' + Date.now())
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) {
            var text = data && formatUpdatedAt(data.updatedAt);
            lastUpdated.textContent = text ? ('上次更新时间：' + text) : '上次更新时间：未知';
          })
          .catch(function() {
            lastUpdated.textContent = '上次更新时间：未知';
          });
      }

      function setVersion(version) {
        var info = versions[version] || versions['BP22'];
        buttons.forEach(function(button) {
          button.classList.toggle('active', button.dataset.version === version);
        });
        subtitle.textContent = info.text + '。';
        openCurrent.href = info.src;
        var matchupLink = document.getElementById('matchup-link');
        if (matchupLink) matchupLink.href = 'matchup.html?version=' + encodeURIComponent(version);
        try { localStorage.setItem('sve_selected_version', version); } catch (error) {}
        if (history && history.replaceState) {
          history.replaceState(null, '', window.location.pathname + '?version=' + encodeURIComponent(version));
        }

        // 该版本报告页尚未生成：不加载 iframe，直接给出提示
        if (!info.exists) {
          showEmpty(version);
          return;
        }
        hideEmpty();
        if (frame.getAttribute('src') !== info.src) {
          showLoading();
          frame.src = info.src;
        } else if (frame.style.display === 'none') {
          frame.style.display = '';
        }
      }

      function showEmpty(version) {
        var info = versions[version] || {};
        var empty = document.getElementById('empty-state');
        var text = document.getElementById('empty-state-text');
        if (text) {
          text.textContent = '版本 ' + version + '（' + (info.text || '').replace(/^当前版本：[^｜]*｜/, '') + '）的报告尚未生成。'
            + '该版本的赛事数据通常在其开始日期之后才会收录，请稍后再来查看。';
        }
        if (empty) empty.style.display = 'flex';
        if (frame) frame.style.display = 'none';
        hideLoading();
      }

      function hideEmpty() {
        var empty = document.getElementById('empty-state');
        if (empty) empty.style.display = 'none';
        if (frame) frame.style.display = '';
      }

      buttons.forEach(function(button) {
        button.addEventListener('click', function() {
          setVersion(button.dataset.version);
        });
      });

      // 「查看最新版本」：优先跳到当前日期所属版本，否则跳到最新有数据的版本
      var latestLink = document.getElementById('empty-state-latest');
      if (latestLink) {
        latestLink.addEventListener('click', function(event) {
          event.preventDefault();
          var now = Date.now();
          var byDate = versionForDate(now);
          var target = (byDate && hasData(byDate)) ? byDate : null;
          if (!target) {
            var keys = Object.keys(versions);
            for (var i = 0; i < keys.length; i++) {
              if (hasData(keys[i])) {
                var st = versions[keys[i]].start ? new Date(versions[keys[i]].start).getTime() : NaN;
                if (!isNaN(st) && now >= st) { target = keys[i]; break; }
              }
            }
          }
          if (!target) {
            var all = Object.keys(versions);
            for (var j = 0; j < all.length; j++) if (hasData(all[j])) { target = all[j]; break; }
          }
          if (target) setVersion(target);
        });
      }
      frame.addEventListener('load', function() {
        hideLoading();
        // 报告页不存在时，浏览器会把 iframe 导航到 404 页面（仍会触发 load），
        // 因此再用 fetch 确认一次，失败则给出提示。
        var src = frame.getAttribute('src');
        if (!src) return;
        // 从 "versions/BP22/xxx.html" 中取出 "BP22"（用 split 而非正则，避免模板字符串里的转义问题）
        var parts = src.split('/');
        var version = parts[0] === 'versions' ? parts[1] : parts[0];
        if (hasData(version)) return;
        fetch(src, { method: 'HEAD' }).then(function(res) {
          if (!res.ok) showEmpty(version);
        }).catch(function() {
          showEmpty(version);
        });
      });
      window.addEventListener('message', function(event) {
        if (event && event.data && event.data.type === 'sve-report-dom-ready') hideLoading();
      });
      showLoading();
      setVersion(getInitialVersion());
      loadLastUpdated();
    })();
  </script>

<body>
  <div class="version-shell">
    <div class="version-bar">
      <div class="version-inner">
        <div class="title">
          <h1>Shadowverse EVOLVE 大会卡组统计</h1>
          <span id="version-subtitle">请选择查询版本；各版本数据、周统计与详情页互相独立。</span>
          <span class="update-info" id="last-updated">上次更新时间：读取中…</span>

          <button class="version-btn" type="button" data-version="BP21" data-src="versions/BP21/shadowverse_evolve_decks.html">BP21</button>
          <button class="version-btn" type="button" data-version="BP20" data-src="versions/BP20/shadowverse_evolve_decks.html">BP20</button>
          <button class="version-btn" type="button" data-version="BP19" data-src="versions/BP19/shadowverse_evolve_decks.html">BP19</button>

          <a class="open-link" id="open-current" href="versions/BP21/shadowverse_evolve_decks.html" target="_blank" rel="noopener">新窗口打开当前版本</a>

  </div>
  <script>
    (function() {
      var versions = {
        BP21: {
          src: 'versions/BP21/shadowverse_evolve_decks.html',
          text: '当前版本：BP21｜时间范围：2026年7月31日起（含7月31日）'
        },
        BP20: {
          src: 'versions/BP20/shadowverse_evolve_decks.html',
          text: '当前版本：BP20｜时间范围：2026年5月22日-2026年7月30日（含首尾日期）'
        },
        BP19: {
          src: 'versions/BP19/shadowverse_evolve_decks.html',
          text: '当前版本：BP19｜时间范围：2026年3月27日-2026年5月21日（含首尾日期）'
        },
        BP18: {
          src: 'versions/BP18/shadowverse_evolve_decks.html',
          text: '当前版本：BP18｜时间范围：2025年11月21日-2026年1月29日（含首尾日期）'
        }
      };
      var frame = document.getElementById('report-frame');
      var loading = document.getElementById('loading');
      var subtitle = document.getElementById('version-subtitle');
      var openCurrent = document.getElementById('open-current');
      var lastUpdated = document.getElementById('last-updated');
      var buttons = Array.prototype.slice.call(document.querySelectorAll('.version-btn'));
      var loadingTimer = null;

      function hideLoading() {
        if (!loading) return;
        loading.style.opacity = '0';
        setTimeout(function() { loading.style.display = 'none'; }, 220);
      }

      function showLoading() {
        if (!loading) return;
        if (loadingTimer) clearTimeout(loadingTimer);
        loading.style.opacity = '1';
        loading.style.display = 'block';
        loadingTimer = setTimeout(hideLoading, 1800);
      }

      function getInitialVersion() {
        var params = new URLSearchParams(window.location.search || '');
        var fromQuery = String(params.get('version') || '').toUpperCase();
        if (versions[fromQuery]) return fromQuery;
        try {
          var saved = String(localStorage.getItem('sve_selected_version') || '').toUpperCase();
          if (versions[saved]) return saved;
        } catch (error) {}
        return 'BP21';
      }

      function formatUpdatedAt(value) {
        if (!value) return '';
        var d = new Date(value);
        if (isNaN(d.getTime())) return '';
        return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      function loadLastUpdated() {
        if (!lastUpdated || !window.fetch) return;
        fetch('last_updated.json?ts=' + Date.now())
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) {
            var text = data && formatUpdatedAt(data.updatedAt);
            lastUpdated.textContent = text ? ('上次更新时间：' + text) : '上次更新时间：未知';
          })
          .catch(function() {
            lastUpdated.textContent = '上次更新时间：未知';
          });
      }

      function setVersion(version) {
        var info = versions[version] || versions.BP21;
        buttons.forEach(function(button) {
          button.classList.toggle('active', button.dataset.version === version);
        });
        subtitle.textContent = info.text + '。';
        openCurrent.href = info.src;
        var matchupLink = document.getElementById('matchup-link');
        if (matchupLink) matchupLink.href = 'matchup.html?version=' + encodeURIComponent(version);
        if (frame.getAttribute('src') !== info.src) {
          showLoading();
          frame.src = info.src;
        }
        try { localStorage.setItem('sve_selected_version', version); } catch (error) {}
        if (history && history.replaceState) {
          history.replaceState(null, '', window.location.pathname + '?version=' + encodeURIComponent(version));
        }
      }

      buttons.forEach(function(button) {
        button.addEventListener('click', function() {
          setVersion(button.dataset.version);
        });
      });
      frame.addEventListener('load', hideLoading);
      window.addEventListener('message', function(event) {
        if (event && event.data && event.data.type === 'sve-report-dom-ready') hideLoading();
      });
      showLoading();
      setVersion(getInitialVersion());
      loadLastUpdated();
    })();
  </script>

  var select = document.getElementById('tournament-select');
  var statRow = document.getElementById('stat-row');
  var typeTableBody = document.getElementById('type-table-body');
  var deckTableBody = document.getElementById('deck-table-body');
  var classChartDom = document.getElementById('class-chart');
  var classChart = null;

  var classColors = {
    '巫师': '#9b59b6', '皇家护卫': '#3498db', '精灵': '#27ae60',
    '梦魇': '#2c3e50', '龙族': '#e67e22', '主教': '#f1c40f',
    '公主连结Re:Dive': '#e91e63', '偶像大师': '#ff8ab3',
    '赛马娘': '#8bd450', 'VG': '#7f8cff'
  };
  var classIcons = {
    '巫师': '🔮', '皇家护卫': '⚔️', '精灵': '🍃', '梦魇': '💀',
    '龙族': '🐉', '主教': '⛪', '公主连结Re:Dive': '💎',
    '偶像大师': '🎤', '赛马娘': '🏇', 'VG': '🎮'
  };

  function formatDate(dateStr) {
    var d = new Date(dateStr);
    return d.getFullYear() + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
  }

  function safeHtml(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function getRankBadge(rank) {
    var colors = { 1: '#FFD700', 2: '#C0C0C0', 3: '#CD7F32' };
    var bg = colors[rank] || '#555';
    return '<span class="rank-badge" style="background:' + bg + '">' + rank + '</span>';
  }

  function classTag(cls) {
    var color = classColors[cls] || '#888';
    var icon = classIcons[cls] || '';
    return '<span class="class-tag" style="background:' + color + '22;color:' + color + ';border:1px solid ' + color + '44">' + icon + ' ' + safeHtml(cls) + '</span>';
  }

  function countUniqueClasses(decks) {
    var set = {};
    decks.forEach(function(d) { set[d.class] = true; });
    return Object.keys(set).length;
  }

  function renderTournament(index) {
    var t = tournaments[index];
    if (!t) return;

    var top8Decks = t.decks.filter(function(d) { return d.rank <= 8; });

    statRow.innerHTML =
      '<span class="stat-pill version">' + safeHtml(t.version) + '</span>' +
      '<span class="stat-pill">📅 ' + formatDate(t.date) + '</span>' +
      '<span class="stat-pill highlight">👥 ' + t.players + '人</span>' +
      '<span class="stat-pill">📊 ' + t.decks.length + ' 套卡组</span>' +
      '<span class="stat-pill">🏆 ' + top8Decks.length + ' 套上位</span>' +
      '<span class="stat-pill">🎨 ' + countUniqueClasses(t.decks) + ' 个职业</span>';

    renderClassChart(t, top8Decks);
    renderTypeTable(t, t.decks);
    renderDeckTable(t);
  }

  function renderClassChart(t, top8Decks) {
    var classCount = {};
    top8Decks.forEach(function(d) {
      classCount[d.class] = (classCount[d.class] || 0) + 1;
    });

    var data = Object.keys(classCount).map(function(cls) {
      return {
        name: (classIcons[cls] || '') + ' ' + cls,
        value: classCount[cls],
        itemStyle: { color: classColors[cls] || '#888' }
      };
    }).sort(function(a, b) { return b.value - a.value; });

    if (classChart) classChart.dispose();
    classChart = echarts.init(classChartDom);

    classChart.setOption({
      tooltip: {
        trigger: 'item',
        formatter: '{b}: {c} ({d}%)',
        backgroundColor: 'rgba(15,15,26,0.92)',
        borderColor: 'rgba(255,255,255,0.12)',
        textStyle: { color: '#e0e0e0' }
      },
      legend: {
        orient: 'horizontal', bottom: 0,
        textStyle: { color: '#8899aa', fontSize: 12 },
        itemWidth: 12, itemHeight: 12
      },
      series: [{
        name: '职业分布', type: 'pie',
        radius: ['38%', '65%'], center: ['50%', '45%'],
        data: data,
        label: { color: '#ccc', fontSize: 13, formatter: '{b}\n{c}套 ({d}%)' },
        labelLine: { lineStyle: { color: '#444' } },
        emphasis: { itemStyle: { shadowBlur: 14, shadowOffsetX: 0, shadowColor: 'rgba(0,0,0,0.5)' } }
      }],
      title: {
        text: '上位 职业分布（共' + top8Decks.length + '套）',
        left: 'center', top: 8,
        textStyle: { color: '#8899aa', fontSize: 14, fontWeight: 'normal' }
      }
    });
  }

  function renderTypeTable(t, top8Decks) {
    var typeStats = {};
    top8Decks.forEach(function(d) {
      var key = d.class + '|' + d.category;
      if (!typeStats[key]) {
        typeStats[key] = { class: d.class, category: d.category, count: 0, bestRank: 999 };
      }
      typeStats[key].count++;
      if (d.rank < typeStats[key].bestRank) typeStats[key].bestRank = d.rank;
    });

    var types = Object.values(typeStats).sort(function(a, b) {
      if (b.count !== a.count) return b.count - a.count;
      return a.bestRank - b.bestRank;
    });

    // 判断赛制：个人赛 or 组队赛
    // 个人赛：展示卡组数是2的幂（8/16/32/64...）
    // 3人组队赛：展示卡组数 = 队伍数 × 3，且队伍数是2的幂
    function getTeamCount(deckCount) {
      // 先判断是否为个人赛（deckCount本身是2的幂）
      var n = deckCount;
      while (n > 1 && n % 2 === 0) n = n / 2;
      if (n === 1) return { teams: deckCount, perTeam: 1, isTeam: false };

      // 判断是否为3人组队赛（deckCount/3是2的幂）
      if (deckCount % 3 === 0) {
        var teams = deckCount / 3;
        var m = teams;
        while (m > 1 && m % 2 === 0) m = m / 2;
        if (m === 1) return { teams: teams, perTeam: 3, isTeam: true };
      }

      // 无法判断时，默认按个人赛处理
      return { teams: deckCount, perTeam: 1, isTeam: false };
    }

    var teamInfo = getTeamCount(top8Decks.length);
    var displayedTeams = teamInfo.teams;
    var html = '';
    types.forEach(function(st) {
      var pct = (st.count / displayedTeams * 100).toFixed(1);
      var barWidth = Math.max(4, pct * 2);
      html += '<tr><td>' + classTag(st.class) + '</td>' +
        '<td><span class="type-tag">' + safeHtml(st.category) + '</span></td>' +
        '<td style="text-align:center">' + st.count + '套</td>' +
        '<td style="text-align:center"><span class="percentage-bar" style="width:' + barWidth + 'px"></span>' + pct + '%</td>' +
        '<td style="text-align:center">' + getRankBadge(st.bestRank) + '</td></tr>';
    });

    if (!html) html = '<tr><td colspan="5" class="no-data">暂无上位卡组数据</td></tr>';
    typeTableBody.innerHTML = html;
  }

  function renderDeckTable(t) {
    var html = '';
    t.decks.forEach(function(d) {
      var coreCardImg = '';
      if (d.core_image) {
        coreCardImg = '<img loading="lazy" decoding="async" src="' + safeHtml(d.core_image) + '" style="width:40px;height:56px;object-fit:cover;border-radius:4px;box-shadow:0 4px 10px rgba(0,0,0,0.35)" alt="' + safeHtml(d.category) + '" title="' + safeHtml(d.category) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'inline-block\'"><span style="display:none;width:40px;height:56px;border-radius:4px;background:#2a2a3e;text-align:center;line-height:56px;font-size:11px;color:#667788">无图</span>';
      } else {
        coreCardImg = '<span style="display:inline-block;width:40px;height:56px;border-radius:4px;background:#2a2a3e;text-align:center;line-height:56px;font-size:11px;color:#667788">无图</span>';
      }
      html += '<tr><td style="text-align:center">' + getRankBadge(d.rank) + '</td>' +
        '<td>' + safeHtml(d.player) + '</td>' +
        '<td>' + classTag(d.class) + '</td>' +
        '<td><span class="type-tag">' + safeHtml(d.category) + '</span></td>' +
        '<td style="text-align:center">' + coreCardImg + '</td>' +
        '<td><a class="deck-code" href="' + safeHtml(d.decklog_url) + '" target="_blank" rel="noopener">' + safeHtml(d.deck_code) + '</a></td></tr>';
    });
    if (!html) html = '<tr><td colspan="6" class="no-data">暂无卡组数据</td></tr>';
    deckTableBody.innerHTML = html;
  }

  // 填充下拉选择器
  tournaments.forEach(function(t, i) {
    var opt = document.createElement('option');
    opt.value = i;
    opt.textContent = '[' + t.version + '] ' + t.name + ' | ' + formatDate(t.date) + ' | ' + t.players + '人';
    select.appendChild(opt);
  });

  select.addEventListener('change', function() {
    renderTournament(parseInt(select.value, 10));
  });

  window.addEventListener('resize', function() {
    if (classChart) classChart.resize();
  });

  if (tournaments.length > 0) {
    renderTournament(0);
  } else {
    statRow.innerHTML = '<span class="stat-pill">暂无100人以上的大赛数据</span>';
    typeTableBody.innerHTML = '<tr><td colspan="5" class="no-data">暂无数据</td></tr>';
    deckTableBody.innerHTML = '<tr><td colspan="6" class="no-data">暂无数据</td></tr>';
  }
})();
</script>
</body>
</html>
